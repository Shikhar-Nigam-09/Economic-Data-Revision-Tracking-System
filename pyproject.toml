[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-monitor"
version = "0.1.0"
description = "Economic Data Monitoring and Revision Tracking System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shikhar" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "fredapi>=0.5.0",
    "pandera>=0.18.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "responses>=0.25.0",
    "ruff>=0.3.0"
]

[project.scripts]
econ-monitor = "econ_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["econ_monitor*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests requiring a database connection (skipped if TEST_DATABASE_URL is missing)",
    "live: tests making live external FRED API calls (skipped by default)"
]
